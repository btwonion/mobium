# A snapshot target: built and tested like the others, not released (vers.release). Moves to each new 26.4 snapshot.
vers.mcVersion=26.4-snapshot-8
# This snapshot only, which Fabric reads as 26.4-alpha.8: the hooks are checked per snapshot
vers.mcVersionRange=26.4-alpha.8
vers.supportedMcVersions=26.4-snapshot-8
vers.release=false

vers.deps.fapi=0.166.2+26.4
vers.deps.modMenu=22.0.0-alpha.6
# Sodium, Iris, EMF, ETF and Vitrail have no 26.4 builds: compiled against their 26.3 builds, kept off the dev runtime
vers.compatRuntime=false
vers.deps.sodium=mc26.3-0.9.2-fabric
vers.deps.sodiumApi=0.9.2+mc26.3
vers.deps.iris=1.11.7+26.3-fabric
vers.deps.emf=3.3.12-fabric-26.3
vers.deps.etf=7.2.6-fabric-26.3
vers.deps.vitrail=0.13.0-beta+mc26.3

modstitch.platform=fabric-loom
