name: release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Release
    permissions: write-all

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # `build` runs the Fabric client gametests, which need the same display as in build-commit.yml: xvfb with Mesa's
      # software OpenGL, and SDL on Mesa's EGL (Xvfb's GLX has no sRGB-capable visual; see the comment there).
      - name: Install xvfb and Mesa
        # The runner image also lists Microsoft's package repository, which these jobs do not need (Java comes from
        # setup-java, xvfb and Mesa from Ubuntu's archive). On 22 Oct 2026 it answered the runners with 403 and
        # apt-get update failed, which stopped the release before it built anything; so it is removed first.
        run: |
          { grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null || true; } | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0
      - name: Build with Gradle
        env:
          SDL_VIDEO_FORCE_EGL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew build --stacktrace
      - name: Release with Gradle
        run: ./gradlew releaseMod --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          NYON_USERNAME: ${{ secrets.NYON_USERNAME }}
          NYON_PASSWORD: ${{ secrets.NYON_PASSWORD }}
      - name: Post Discord Webhook
        run: ./gradlew postUpdate --stacktrace
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
      - name: Sync Modrinth description
        uses: btwonion/mc-readme-sync@v1
        with:
          modrinth-api-key: ${{ secrets.MODRINTH_API_KEY }}
          curseforge-api-key: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-project-id: "8i5oedw8"
          curseforge-project-id: "1759818"
          readme-path: README.md