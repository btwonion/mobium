name: build-commit

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "src/main/resources/assets/*/lang/**"
      - "docs/**"
      - "media/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "src/main/resources/assets/*/lang/**"
      - "docs/**"
      - "media/**"
  workflow_dispatch:

concurrency:
  group: build-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: ${{ matrix.version }} / ${{ matrix.loader }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.3"
            loader: fabric
          - version: "26.3"
            loader: neoforge

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # Fabric client gametests run inside `check`; they need a display, provided by xvfb with Mesa's software OpenGL.
      # Minecraft asks SDL for an OpenGL 3.3 core context with an sRGB-capable framebuffer. Xvfb's GLX offers no such
      # visual ("Couldn't find matching GLX visual"; the game then waits on its "no graphics backend" screen until the
      # job times out), so SDL is told to use Mesa's EGL on X11 instead, which supports sRGB surfaces. SDL 3 calls the
      # hint SDL_VIDEO_FORCE_EGL (SDL 2's SDL_VIDEO_X11_FORCE_EGL no longer exists). Checked locally with
      # SDL_VIDEO_DRIVER=x11 and llvmpipe: the game starts and the gametests pass.
      - name: Install xvfb and Mesa
        if: matrix.loader == 'fabric'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0 mesa-utils
      - name: Show the virtual display's OpenGL
        if: matrix.loader == 'fabric'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" eglinfo -B -p x11 || true
          xvfb-run -a -s "-screen 0 1920x1080x24" glxinfo -B || true
      - name: Build, unit tests and client gametests
        if: matrix.loader == 'fabric'
        timeout-minutes: 25
        env:
          SDL_VIDEO_FORCE_EGL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :${{ matrix.version }}-${{ matrix.loader }}:build --stacktrace
      - name: Build and unit tests
        if: matrix.loader != 'fabric'
        run: ./gradlew :${{ matrix.version }}-${{ matrix.loader }}:build --stacktrace
      - name: Store gametest screenshots
        if: always() && matrix.loader == 'fabric'
        uses: actions/upload-artifact@v7
        with:
          name: gametest-screenshots-${{ matrix.version }}-${{ matrix.loader }}
          if-no-files-found: warn
          path: versions/${{ matrix.version }}-${{ matrix.loader }}/build/run/clientGameTest/screenshots/
      # The gametests a second time on Minecraft's Vulkan backend, on Mesa's lavapipe (software Vulkan, with
      # shaderFloat64): the static cache and Module 2 with its byte-for-byte validation (PLAN.md M7, Gate D). Dev runs on
      # Vulkan leave Iris out (it stops the game there) and run Module 2 there (-Dmobium.parts.vulkan).
      - name: Install Mesa's software Vulkan
        if: matrix.loader == 'fabric'
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Show lavapipe
        if: matrix.loader == 'fabric'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: vulkaninfo --summary || true
      - name: Client gametests on Vulkan (lavapipe)
        if: matrix.loader == 'fabric'
        timeout-minutes: 25
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          ./gradlew :${{ matrix.version }}-${{ matrix.loader }}:runClientGameTest -Pmobium.graphicsBackend=vulkan --stacktrace
      - name: Store Vulkan gametest screenshots
        if: always() && matrix.loader == 'fabric'
        uses: actions/upload-artifact@v7
        with:
          name: gametest-screenshots-vulkan-${{ matrix.version }}-${{ matrix.loader }}
          if-no-files-found: warn
          path: versions/${{ matrix.version }}-${{ matrix.loader }}/build/run/clientGameTest/screenshots/
      - name: Store test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.version }}-${{ matrix.loader }}
          if-no-files-found: warn
          path: |
            versions/${{ matrix.version }}-${{ matrix.loader }}/build/reports/
            versions/${{ matrix.version }}-${{ matrix.loader }}/build/test-results/
            versions/${{ matrix.version }}-${{ matrix.loader }}/build/run/clientGameTest/logs/
      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mobium-${{ matrix.version }}-${{ matrix.loader }}
          path: versions/${{ matrix.version }}-${{ matrix.loader }}/build/libs/*.jar
