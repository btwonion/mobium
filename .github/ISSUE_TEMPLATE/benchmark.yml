name: Benchmark result
description: How fast your game runs with Mobium on and off
title: "Benchmark: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for measuring! The benchmark builds its own scenes, so results from different computers compare:

        1. Create a new world: in the World tab set World Type to **Superflat** and the seed to `mobium`, and under
           More → Data Packs move **Mobium Benchmark** to the selected packs.
        2. Type `/mobium benchmark` and leave the game alone until the result shows in chat (about six minutes).

        It measures a storage room and mob pens with Mobium off, on, on and off, so the game slowing down as it warms
        up favours neither. Chat notes about battery power or the power profile are fine; the file records both.
  - type: textarea
    id: result
    attributes:
      label: Benchmark file
      description: >-
        Drag the file chat names (`mobium-bench/benchmark-<date>.csv` in your game folder; clicking its name in chat
        opens the folder) into this box, or paste its content. It names your CPU, GPU and driver, operating system,
        mods and screen.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. A laptop or a desktop, other mods, anything that looked wrong while it ran.
