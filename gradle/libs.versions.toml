[versions]
kotlin = "2.4.21"
mod-publish = "2.2.+"
moddev = "2.0.148"
fabric-loader = "0.20.0"
fabric-language-kotlin = "1.14.2+kotlin."
klf = "2.15.0"
konfig = "3.0.1"
modstitch = "0.8.5"
junit = "6.1.3"

[libraries]
konfig = { module = "dev.nyon:konfig", version.ref = "konfig" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
modstitch = { id = "dev.isxander.modstitch.base", version.ref = "modstitch" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
